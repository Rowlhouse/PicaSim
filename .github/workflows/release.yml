name: Release

# Builds every platform from the current commit and gathers the files for a
# GitHub release. Start it by hand: Actions > Release > Run workflow.
#
# On main it creates a draft release for the version at the top of
# VERSIONS.txt, with the files attached. The draft stays private until it is
# published from the Releases page, which is also when the v<version> tag is
# created. On any other branch it is a dry run: the same builds, but the files
# are only uploaded as a workflow artifact and no release is created.
#
# The Android APK is signed with a key kept only for GitHub downloads (not the
# Google Play key). It lives in secrets on the android-release environment,
# which should require approval before the job can use it.

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(head -1 VERSIONS.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Version from VERSIONS.txt: $VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Tag v$VERSION already exists. Add a new version to the top of VERSIONS.txt first."
              exit 1
            fi
            echo "::warning::Tag v$VERSION already exists. Continuing because this is a dry run."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    uses: ./.github/workflows/windows-build.yml

  linux:
    needs: version
    uses: ./.github/workflows/linux-build.yml

  macos:
    needs: version
    uses: ./.github/workflows/macos-build.yml

  android:
    needs: version
    runs-on: ubuntu-latest
    environment: android-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Generate asset manifest
        run: |
          python3 tools/generate_asset_manifest.py data data/assets_manifest.txt packaging_excludes.txt

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The ANDROID_$name secret is not set on the android-release environment"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Java properties files treat backslashes as escapes, so double them
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > android/keystore.properties

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease

      - name: Check signature
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Remove signing key
        if: always()
        run: |
          rm -f android/keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Name APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/PicaSim-$VERSION.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: picasim-android-release
          path: dist/PicaSim-*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          cp "artifacts/picasim-windows-installer/PicaSim-$VERSION-Setup.exe" release/
          (cd artifacts/picasim-windows-x64 && zip -qr "$GITHUB_WORKSPACE/release/PicaSim-$VERSION-Windows.zip" "PicaSim-$VERSION")
          cp "artifacts/picasim-linux-x64/PicaSim-$VERSION-x86_64.AppImage" release/
          cp "artifacts/picasim-linux-arm64/PicaSim-$VERSION-aarch64.AppImage" release/
          cp "artifacts/picasim-universal/PicaSim-$VERSION.dmg" release/
          cp "artifacts/picasim-android-release/PicaSim-$VERSION.apk" release/
          ls -l release

      - name: Upload release files (dry run)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: picasim-release-files
          path: release/
          retention-days: 7

      - name: Create draft release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "PicaSim $VERSION" \
            --notes "Draft created by the Release workflow. Write the release notes here before publishing."
