name: Windows Build

on:
  push:
    branches:
      - main
      - refactor1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
      
      - name: Configure CMake
        run: |
          cmake --preset windows-x64
      
      - name: Build Release
        run: |
          cmake --build --preset windows-x64-release
      
      - name: Install
        run: |
          cmake --install build/windows-x64 --config Release
      
      # Runs Inno Setup (preinstalled on the windows-2022 runner) on the
      # installed dist/PicaSim-<version> folder, producing dist/PicaSim-<version>-Setup.exe
      - name: Build installer
        run: |
          cmake --build --preset windows-x64-release --target installer
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picasim-windows-x64
          path: |
            dist/
            !dist/*-Setup.exe
          retention-days: 30
      
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: picasim-windows-installer
          path: dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 30
